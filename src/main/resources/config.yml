  away-rate: 0.25
  follow-teleport-blocks: 16
  cry-interval-seconds: 45

moments:
  enabled: true
  juvenile-hours: 24
  initial-delay-min-seconds: 180
  initial-delay-max-seconds: 420
  juvenile-interval-min-seconds: 120
