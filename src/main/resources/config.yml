care:
  hunger-minutes-to-critical: 30  # Minutes for full hunger to reach the critical threshold.
  mood-minutes-to-critical: 30    # Minutes for full mood to reach critical without play.
  energy-minutes-to-critical: 40  # Minutes for full energy to reach critical while walking.
  dirty-every-minutes: 20
  dirty-loss: 30
  minutes-until-unwell: 3
  minutes-until-sick: 3
  decay-while-stored: false
  death-on-neglect: false
  play-seconds: 6
  play-mood-gain: 22
  play-energy-cost: 3
  favorite-mood-multiplier: 1.5
  favorite-food-mood: 8           # Mood points gained when a hungry pet eats an accepted treat.
  sleep-minutes-to-full: 8
  sleeping-hunger-multiplier: 0.5 # Hunger decay while sleeping relative to normal (0.5 = half).
  health-loss-per-minute: 12      # Health points lost per minute with critical physical needs and illness.
  health-regen-per-minute: 20     # Health points recovered per minute when physical needs allow recovery.
  medicine-health-bump: 20
  bond-gain-per-minute: 0.4
  bond-loss-per-minute: 0.8
  wake-mood-penalty: 8
  critical-sound-seconds: 8
  overfeed-mood-penalty: 12
  overfeed-health-penalty: 8
  struck-mood-penalty: 6
  rest-again-seconds: 45

play:
  fetch-speed-multiplier: 1.2     # Fetch pace relative to normal movement (1.2 = 20% faster).
  toy-attention-seconds: 20       # Seconds before a held toy becomes boring without renewed play/movement.
  favorite-toy-attention-seconds: 35
  throw-speed-low: 0.6
  throw-speed-high: 1.1

training:
  default-tricks: [follow]
  attempts-before-bored: 6
  reward-gain: 20
  fail-gain: 2
  reward-window-seconds: 3
  sometimes-at: 40
  learned-at: 80
  session-distance: 8
  attempt-energy-cost: 8
  attempt-hunger-cost: 5
  attempt-mood-cost: 4
  treat-hunger-gain: 3
  rest-seconds: 90

custom-tricks: {}

limits:
  max-stored: 20
  max-out: 4

presence:
  owner-near-radius: 32
  away-rate: 0.25
  cry-interval-seconds: 45

moments:
  greeting:
    enabled: true
    absence-seconds: 300
    near-radius: 8
    cooldown-seconds: 300
    duration-seconds: 8
    circle-radius: 2
    speed: 1.35
    sound-interval-seconds: 1.2
    jump-enabled: true
    tail-wag-hz: 3
    cat-circle-radius: 1.4
    cat-speed: 0.8
    cat-sound-interval-seconds: 0.65
  enabled: true
  belly-up:
    enabled: true
    chance: 25                   # Percent chance per eligible petting attempt.
    idle-seconds: 5               # Seconds without a belly rub before standing up.
    cooldown-seconds: 60
    min-mood: 70
  juvenile-hours: 24
  initial-delay-min-seconds: 180
  initial-delay-max-seconds: 420
  juvenile-interval-min-seconds: 120
  juvenile-interval-max-seconds: 360
  adult-interval-min-seconds: 300
  adult-interval-max-seconds: 720
  inactive-retry-seconds: 60
  owner-radius: 8
  target-radius: 6
  plant-search-radius: 2
  low-mood-threshold: 55
  low-mood-bark-chance: 35
  mischief-min-energy: 40
  juvenile-mischief-chance: 40
  adult-mischief-chance: 8
  juvenile-bark-chance: 20
  adult-bark-chance: 47
  digging-enabled: true
  juvenile-dig-chance: 15
  adult-dig-chance: 10
  dig-min-energy: 40
  dig-loot:                       # Weight is a relative chance, not the number of items.
    - {item: STICK, weight: 45}
    - {item: BONE, weight: 30}
    - {item: RABBIT, weight: 15}
    - {item: LEATHER_BOOTS, weight: 10}
  plant-breaking-enabled: true
  respect-mob-griefing: true
  plants:
    - SHORT_GRASS
    - FERN
    - DEAD_BUSH
    - DANDELION
    - POPPY
  affection-particle: SPLASH
  affection-particle-count: 3
  bark-particle: ANGRY_VILLAGER
  bark-particle-count: 2
  mischief-particle: POOF
  mischief-particle-count: 5

social:
  enabled: true
  encounter-radius: 8
  greeting-radius: 5
  greeting-seconds: 3
  separation-seconds: 10
  greeting-friendship-gain: 2
  sniff-friendship-gain: 6
  chase-friendship-gain: 8
  max-friendship-gain-per-minute: 12
  bark-radius: 6
  owner-radius: 16
  search-interval-seconds: 3      # Seconds between searches for new pet encounters.
  encounter-cooldown-seconds: 60
  encounter-chance: 20           # Percent chance per eligible search after cooldown; first greetings always happen.
  bark-seconds: 8
  calm-cooldown-seconds: 30
  territorial-bark-chance: 80
  same-owner-bark-chance: 10
  chase-chance: 50
  calm-clicks: 3

roaming:
  stationary-seconds: 2
  name-attention-seconds: 10

orders:
  hearing-radius: 12

# Configuration guide and examples: README.md. Built-in species: dog, cat.
items:
  kennel: BARREL
  kennel-block: BARREL
  treats: [mmoitems:PETS:FISH_SNACK, mmoitems:PETS:BISCUIT_TREAT]
  foods:
    - {item: mmoitems:PETS:MEAT_TREAT, hunger: 35}
    - {item: mmoitems:PETS:FISH_TREAT, hunger: 35}
  medicines: [mmoitems:PETS:PET_MEDICINE]
  brushes: [mmoitems:PETS:PET_BRUSH]
  toys: [STICK, mmoitems:PETS:PET_BALL, mmoitems:PETS:PET_CHEW_BONE, mmoitems:PETS:PET_TUG_ROPE, mmoitems:PETS:PET_MOUSE_PLUSH, mmoitems:PETS:PET_TEDDY_PLUSH]

# Built-in species: dog, cat. Define shared overrides or custom species here.
# Guide: https://github.com/TF-Minecraft/CompanionPets#pet-configuration
species: {}

# Example pet: {species: dog, model: beagle, egg: 'mmoitems:PETS:PET_BEAGLE_EGG'}
# Optional pet adjustment: behaviors: {add: [cat-play], remove: [dig-gifts]}
pets:
  wolf:
    species: dog
    egg: WOLF_SPAWN_EGG
  cat:
    species: cat
    egg: CAT_SPAWN_EGG
