name: CompanionPets
main: net.tfminecraft.companionpets.PetsPlugin
version: ${project.version}
api-version: "1.21.10"
description: Pets you hatch, care for, and train. Each one keeps its needs, favorite toy, and tricks.

commands:
  companionpets:
    description: CompanionPets test utilities
    usage: /companionpets <order WORD|calm|testdog [name]|moment TYPE|personality TYPE|social TYPE|owner TARGET>

permissions:
  companionpets.test:
    description: CompanionPets test utilities
    default: op

softdepend:
  - MythicMobs
  - ModelEngine
  - ItemsAdder
  - MMOItems
